<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#1D2240">
<title>Clavier en jeu — s’entraîner à taper</title>

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===== 1. VARIABLES ET BASE ===== */
:root{
  --ink:#1D2240; --soft:#545B7A; --bg:#F3F6FB; --card:#fff; --line:#C9D3E8;
  --teal:#2F7F86; --teal-d:#235F65; --amber:#E9C46A; --amber-d:#8A5A00;
  --ok:#1E7A46; --ok-bg:#DDF0E4; --ko:#B3261E; --ko-bg:#F8DAD7; --navy2:#2B3363;
  --fs:1; --r:20px;
}
*{box-sizing:border-box}
html{font-size:calc(100% * var(--fs))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;line-height:1.5;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--amber-d);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:1rem}
#app:focus{outline:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== 2. EN-TÊTE ET NAVIGATION ===== */
header.top{background:linear-gradient(135deg,var(--ink),var(--navy2));color:#fff;border-radius:0 0 28px 28px;padding:.8rem 1rem 1rem}
.top .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.5rem;cursor:pointer;background:none;border:0;color:#fff;padding:.2rem .4rem;border-radius:14px}
.logo .ic{background:var(--amber);color:var(--ink);border-radius:14px;padding:.1rem .5rem;font-size:1.5rem}
nav.menu{display:flex;flex-wrap:wrap;gap:.4rem}
.nb{min-height:44px;min-width:44px;border-radius:999px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;padding:.3rem .9rem;cursor:pointer;font-weight:700}
.nb:hover,.nb[aria-current="page"]{background:#fff;color:var(--ink)}

/* ===== 3. CARTES ET BOUTONS ===== */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:1.2rem;margin:1rem 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.btn{min-height:48px;border-radius:999px;border:2px solid var(--teal-d);background:var(--teal);color:#fff;font-weight:800;padding:.5rem 1.4rem;cursor:pointer;font-size:1.1rem}
.btn:hover{background:var(--teal-d)}
.btn.big{font-size:1.5rem;padding:.8rem 2.2rem}
.btn.ghost{background:#fff;color:var(--teal-d)}
.btn.ghost:hover{background:#E6F1F2}
.btn.danger{background:#fff;color:var(--ko);border-color:var(--ko)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.choix{display:flex;flex-wrap:wrap;gap:.5rem}
.choix label{cursor:pointer}
.choix input{position:absolute;opacity:0;width:1px;height:1px}
.choix span{display:inline-flex;align-items:center;gap:.4rem;min-height:48px;border:2px solid var(--line);border-radius:999px;padding:.4rem 1.1rem;background:#fff;font-weight:700}
.choix input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
.choix input:checked+span::before{content:"✔"}
.choix input:focus-visible+span{outline:4px solid var(--amber-d);outline-offset:2px}
.hero{display:grid;grid-template-columns:1fr;gap:.5rem;text-align:center;padding:1rem}
.hero h1{font-size:clamp(2rem,6vw,3.2rem)}
.pill{display:inline-block;background:var(--amber);color:var(--ink);border-radius:999px;padding:.1rem .8rem;font-weight:800}
.note{color:var(--soft);font-size:.95rem}
select.sel{min-height:48px;border:2px solid var(--line);border-radius:999px;padding:.3rem 1rem;background:#fff;font-weight:700;max-width:100%}
input.txt{min-height:44px;border:2px solid var(--line);border-radius:14px;padding:.3rem .8rem;width:100%;max-width:300px;background:#fff}

/* ===== 4. ÉCRAN DE JEU ===== */
.hud{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:.2rem .9rem;font-weight:800;min-height:44px;display:inline-flex;align-items:center;gap:.4rem}
.chip.warn{background:var(--ko-bg);border-color:var(--ko);color:var(--ko)}
.bar{height:14px;border-radius:999px;background:#DCE3F2;overflow:hidden;margin:.6rem 0}
.bar>i{display:block;height:100%;background:var(--teal);width:0;transition:width .25s}
.zone{background:#fff;border:3px solid var(--ink);border-radius:var(--r);padding:1.2rem 1rem;position:relative}
.emoji{font-size:clamp(3rem,9vw,5rem);text-align:center;line-height:1}
.phrase{font:700 clamp(1.6rem,3.6vw,2.6rem)/1.9 Consolas,"Courier New",monospace;white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere;text-align:center;margin:.3rem 0;user-select:none}
.phrase span{border-radius:6px;padding:0 .02em}
.phrase .w{white-space:nowrap}
.phrase .todo{color:#6D7390}
.phrase .ok{color:var(--ok);background:var(--ok-bg)}
.phrase .bad{color:var(--ko);background:var(--ko-bg);text-decoration:underline wavy}
.phrase .cur{background:var(--amber);color:var(--ink);box-shadow:0 3px 0 var(--amber-d)}
.phrase .extra{color:var(--ko);background:var(--ko-bg)}
#saisie{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;left:0;top:0}
.focus-msg{position:absolute;inset:0;background:rgba(29,34,64,.88);color:#fff;border-radius:calc(var(--r) - 3px);display:grid;place-items:center;font-size:1.5rem;font-weight:800;cursor:text;text-align:center;padding:1rem}
.msg{min-height:2.2em;text-align:center;font-weight:800;font-size:1.2rem}
.msg.ko{color:var(--ko)} .msg.ok{color:var(--ok)}
.stars{font-size:2rem;letter-spacing:.2rem}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* ===== 5. CLAVIER VISUEL (AZERTY) ===== */
.kbbox{margin-top:1rem}
.kb{display:grid;gap:.3rem;user-select:none}
.krow{display:flex;gap:.3rem}
.key{flex:var(--w,1) 1 0;min-width:0;height:clamp(2.4rem,4.4vw,3.5rem);border-radius:.7rem;background:#fff;border:2px solid var(--line);border-bottom-width:5px;display:grid;place-items:center;position:relative;font-weight:800;font-size:clamp(1.1rem,2.6vw,2rem);color:var(--ink)}
.key.sp{border-color:transparent;background:transparent}
.key.mod{font-size:clamp(.7rem,1.4vw,1rem);background:#EDF1F9}
.key .s{position:absolute;top:2px;left:6px;font-size:.45em;color:var(--soft)}
.key .a{position:absolute;bottom:0;right:6px;font-size:.45em;color:var(--teal-d)}
.key.hl{background:var(--amber);border-color:var(--amber-d);transform:translateY(3px);border-bottom-width:2px}
.key.hl2{background:#FBEFC8;border:3px dashed var(--amber-d)}
.key[data-step]::after{content:attr(data-step);position:absolute;top:-9px;right:-5px;background:var(--ink);color:#fff;border-radius:999px;font-size:.7rem;width:1.3rem;height:1.3rem;display:grid;place-items:center}
.howto{text-align:center;font-weight:800;font-size:1.25rem;min-height:1.8em;margin:.3rem 0}

/* ===== 6. RÉSULTATS ET TUTOS ===== */
.score{font-size:clamp(3.5rem,14vw,7rem);font-weight:900;line-height:1;color:var(--ink)}
.score small{font-size:.35em;color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}
.stat{background:#EDF1F9;border-radius:16px;padding:.6rem .8rem;text-align:center}
.stat b{display:block;font-size:1.8rem}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:2px solid var(--line);padding:.4rem .5rem;text-align:left;vertical-align:top}
.cap{display:inline-block;min-width:2.4rem;text-align:center;font:800 1.3rem Consolas,monospace;background:#fff;border:2px solid var(--ink);border-bottom-width:5px;border-radius:.6rem;padding:0 .5rem;margin:0 .1rem}
.tuto h3{font-size:1.4rem}
.tuto .touches{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.5rem 0;font-size:1.1rem}
.essai{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.5rem}
.essai input{min-height:48px;font:700 1.3rem Consolas,monospace;border:2px solid var(--line);border-radius:14px;padding:.2rem .8rem;width:min(100%,360px)}
.essai input.good{border-color:var(--ok);background:var(--ok-bg)}

/* ===== 7. FENÊTRES, PAUSE, ALERTES ===== */
.veil{position:fixed;inset:0;background:rgba(29,34,64,.7);display:grid;place-items:center;padding:1rem;z-index:50}
.dlg{background:#fff;border-radius:24px;max-width:520px;width:100%;padding:1.4rem;max-height:90dvh;overflow:auto}
.dlg .acts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
#toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:.6rem 1.2rem;font-weight:700;z-index:60;max-width:92vw}
.update{background:var(--amber);border-radius:16px;padding:.5rem 1rem;margin:.5rem 0;font-weight:700;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;justify-content:space-between}
footer{text-align:center;color:var(--soft);padding:1.5rem 1rem 2rem;font-size:.95rem}
@media (max-width:700px){.phrase{line-height:1.7}.key .s,.key .a{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header.top,nav,.btn,footer{display:none}}
</style>
</head>

<script>

"use strict";

/* ===== A. MOTEUR : fonctions pures, sans accès à la page (donc testables) ===== */
// MOTEUR-DEBUT
const Moteur=(function(){
  // Clavier AZERTY d’ordinateur PC : [touche seule, avec Maj, avec AltGr]
  const LAYOUT=[
    [["²","",""],["&","1",""],["é","2","~"],["\"","3","#"],["'","4","{"],["(","5","["],["-","6","|"],["è","7","`"],["_","8","\\"],["ç","9","^"],["à","0","@"],[")","°","]"],["=","+","}"]],
    [["a","",""],["z","",""],["e","","€"],["r","",""],["t","",""],["y","",""],["u","",""],["i","",""],["o","",""],["p","",""],["^","¨",""],["$","£","¤"]],
    [["q","",""],["s","",""],["d","",""],["f","",""],["g","",""],["h","",""],["j","",""],["k","",""],["l","",""],["m","",""],["ù","%",""],["*","µ",""]],
    [["<",">",""],["w","",""],["x","",""],["c","",""],["v","",""],["b","",""],["n","",""],[",","?",""],[";",".",""],[":","/",""],["!","§",""]]
  ];
  const DEADKEY="k1-10"; // touche ^ / ¨ (touche morte)
  const MAP={}; // caractère -> {id, mod, c}
  LAYOUT.forEach(function(row,r){row.forEach(function(k,c){
    const id="k"+r+"-"+c; const b=k[0]; let s=k[1]; const a=k[2];
    if(!s && /^[a-z]$/.test(b)) s=b.toUpperCase();
    const morte=(r===1&&c===10);
    if(!morte){ if(b) MAP[b]={id:id,mod:"",c:c}; if(s) MAP[s]={id:id,mod:"shift",c:c}; }
    if(a) MAP[a]={id:id,mod:"altgr",c:c};
  });});
  const CIRC={"â":"a","ê":"e","î":"i","ô":"o","û":"u","Â":"A","Ê":"E","Î":"I","Ô":"O","Û":"U"};
  const TREMA={"ä":"a","ë":"e","ï":"i","ö":"o","ü":"u","ÿ":"y","Ä":"A","Ë":"E","Ï":"I","Ö":"O","Ü":"U"};
  const CAPACC={"É":"é","È":"è","À":"à","Ù":"ù","Ç":"ç"};
  const NOMS={" ":"espace",",":"virgule",".":"point","?":"point d’interrogation","!":"point d’exclamation",":":"deux-points",";":"point-virgule","'":"apostrophe","-":"tiret","(":"parenthèse ouvrante",")":"parenthèse fermante","@":"arobase","#":"dièse","%":"pourcentage","€":"euro","+":"plus","=":"égal","/":"barre oblique","\"":"guillemet droit","[":"crochet ouvrant","]":"crochet fermant","{":"accolade ouvrante","}":"accolade fermante","&":"esperluette (et commercial)","*":"astérisque","_":"tiret bas","°":"degré","|":"barre verticale","\\":"barre oblique inverse","^":"accent circonflexe seul","$":"dollar","<":"inférieur à",">":"supérieur à"};

  function nom(ch){
    if(NOMS[ch]) return NOMS[ch];
    if(/[0-9]/.test(ch)) return "chiffre "+ch;
    if(ch!==ch.toLowerCase()) return "majuscule « "+ch+" »";
    return "lettre « "+ch+" »";
  }
  function modKeys(loc){ // quelle touche Maj / AltGr utiliser (main opposée)
    if(loc.mod==="shift") return [loc.c<=5?"shiftR":"shiftL"];
    if(loc.mod==="altgr") return ["altgr"];
    return [];
  }
  function etiquette(id){ // nom d’une touche pour les consignes
    const m=/^k(\d)-(\d+)$/.exec(id); const k=LAYOUT[+m[1]][+m[2]];
    if(+m[1]===0 && /[0-9]/.test(k[1])) return k[1];
    return k[0].toUpperCase();
  }
  // Comment taper un caractère : {steps:[{keys:[ids],txt}], text}  (null si impossible)
  function howTo(ch){
    let steps=null;
    if(ch===" ") steps=[{keys:["space"],txt:"Barre d’espace"}];
    else if(MAP[ch]){
      const loc=MAP[ch]; const lab=etiquette(loc.id); let txt;
      if(loc.mod==="shift") txt="Maj + "+(/[a-z]/i.test(ch)?ch:lab);
      else if(loc.mod==="altgr") txt="AltGr + "+lab+((ch==="^"||ch==="`"||ch==="~")?", puis Espace":"");
      else txt="Touche "+lab+(+/^k0-/.test(loc.id)?" (sans Maj)":"");
      steps=[{keys:modKeys(loc).concat([loc.id]),txt:txt}];
    } else if(CIRC[ch]||TREMA[ch]){
      const voy=CIRC[ch]||TREMA[ch]; const v=MAP[voy]; const tr=!!TREMA[ch];
      steps=[
        {keys:tr?["shiftL",DEADKEY]:[DEADKEY],txt:tr?"Maj + ^ (fait ¨)":"^"},
        {keys:modKeys(v).concat([v.id]),txt:(v.mod==="shift"?"Maj + ":"")+voy.toLowerCase()}
      ];
    } else if(CAPACC[ch]){
      const loc=MAP[CAPACC[ch]];
      steps=[{keys:["caps"],txt:"Verr. Maj"},{keys:[loc.id],txt:CAPACC[ch]}];
    }
    if(!steps) return null;
    return {steps:steps,text:steps.map(function(s){return s.txt;}).join("  puis  ")};
  }
  function tutoPour(ch){ // numéro de tuto conseillé pour un caractère
    if(/[0-9]/.test(ch)) return "chiffres";
    if(ch==="@") return "arobase";
    if("éèàùç".indexOf(ch)>=0) return "accents";
    if(CIRC[ch]&&ch===ch.toLowerCase()) return "circonflexe";
    if(TREMA[ch]&&ch===ch.toLowerCase()) return "trema";
    if(CAPACC[ch]||CIRC[ch]||TREMA[ch]) return "capaccent";
    if(/[A-Z]/.test(ch)) return "maj";
    if("#{}[]|€\\^".indexOf(ch)>=0) return "altgr";
    if("()-'\"_%+=&*".indexOf(ch)>=0) return "signes";
    if(",.?!:;/".indexOf(ch)>=0) return "ponct";
    return null;
  }
  function norm(s){return s.replace(/’/g,"'").replace(/[  ]/g," ");}
  function premiereFaute(t,v){ // indice du premier caractère faux, -1 si tout est juste
    for(let i=0;i<v.length;i++){ if(i>=t.length||v[i]!==t[i]) return i; }
    return -1;
  }
  function nouvelExo(cible){
    return {target:cible,val:"",errors:0,dels:0,started:false,tFirst:0,lastOk:0,tEnd:0,streak:false,okLen:0,done:false,times:[],errList:[]};
  }

  function traiter(ex,brut,now){
    const v=norm(brut), prev=ex.val, t=ex.target;

// Construit le clavier visuel AZERTY ; retourne {id: élément}
function construireClavier(){
  const map={}; const kb=h("div",{class:"kb","aria-hidden":"true"});
  const spacer=function(w){return h("div",{class:"key sp",style:"--w:"+w});};
  const mod=function(id,l,w){const e=h("div",{class:"key mod",style:"--w:"+w,text:l});map[id]=e;return e;};
  const touche=function(r,c){
    const k=Moteur.LAYOUT[r][c]; const e=h("div",{class:"key"},h("span",{text:/^[a-z]$/.test(k[0])?k[0].toUpperCase():k[0]}));
    if(k[1]&&!/^[a-z]$/.test(k[0])) e.appendChild(h("span",{class:"s",text:k[1]}));
    if(k[2]) e.appendChild(h("span",{class:"a",text:k[2]}));
    map["k"+r+"-"+c]=e;return e;
  };
  const rangee=function(){return h("div",{class:"krow"},[].slice.call(arguments));};
  const r0=[];for(let c=0;c<13;c++)r0.push(touche(0,c));r0.push(mod("back","⌫ Effacer",2));
  const r1=[spacer(1.5)];for(let c=0;c<12;c++)r1.push(touche(1,c));r1.push(spacer(1.5));
  const r2=[mod("caps","Verr. Maj",1.8)];for(let c=0;c<12;c++)r2.push(touche(2,c));r2.push(spacer(1.2));
  const r3=[mod("shiftL","⇧ Maj",1.4)];for(let c=0;c<11;c++)r3.push(touche(3,c));r3.push(mod("shiftR","⇧ Maj",2.6));
  const r4=[spacer(3.5),mod("space","Espace",7),mod("altgr","AltGr",1.5),spacer(3)];
  [r0,r1,r2,r3,r4].forEach(function(r){kb.appendChild(rangee.apply(null,r));});
  return {kb:kb,map:map};
}

/* ===== F. FIN DE PARTIE ===== */
function finDePartie(){
  const s=S.sess; clearInterval(T.iv);
  const b=Moteur.bilan(s.res,s.times,s.errs,{chrono:s.chrono,allo:s.mode==="allophone"});
  const cle=s.mode+"-"+s.n+"-"+(s.chrono?"chrono":"libre")+(s.niveau?"-n"+s.niveau:"-p"), ancien=S.bests[cle];
  const record=!ancien||b.score>ancien.score;
  if(record) S.bests[cle]={score:b.score,d:jourLocal()};
  S.hist.push({d:jourLocal(),mode:s.mode,n:s.n,niv:s.niveau,chrono:s.chrono,score:b.score,err:b.err,dels:b.dels,ms:Math.round(b.ms),hard:b.dur.slice(0,3).map(function(x){return x.c;})});
  S.hist=S.hist.slice(-50); sauver();
  S.dernier={b:b,res:s.res,mode:s.mode,n:s.n,niveau:s.niveau,chrono:s.chrono,serieMax:s.serieMax,record:record,premier:!ancien};
  montrer("fin",{force:true});
}
function texteResultat(d){
  const b=d.b, pseudo=S.prefs.pseudo?(S.prefs.pseudo+" — "):"";
  return pseudo+"Clavier en jeu : "+b.score+" / 100 ("+b.rang.t+")\n"
    +(d.mode==="allophone"?"Mode allophone":"Mode classique")+", "+d.n+" exercices, "+(d.niveau?"niveau "+d.niveau:"difficulté progressive")+", "+(d.chrono?"défi chrono":"sans chrono")+"\n"
    +"Erreurs : "+b.err+" · Effacements : "+b.dels+" · Temps : "+dureeTxt(b.ms)+" · Vitesse : "+b.cpm+" signes/min\n"
    +(b.dur.length?"Touches à travailler : "+b.dur.map(function(x){return x.c===" "?"espace":x.c;}).join(" "):"Aucune touche difficile");
}

  const dur=b.dur.length?h("table",{},h("thead",{},h("tr",{},["Touche","Nom","Erreurs","Temps moyen","Comment la taper",""].map(function(t){return h("th",{text:t});}))),
    h("tbody",{},b.dur.map(function(x){

        h("td",{text:x.n?sec1(x.moy):"—"}),h("td",{text:hw?hw.text:"—"}),
        h("td",{},tu?h("button",{class:"btn ghost",type:"button",text:"Tuto",onclick:function(){montrer("tuto",{ancre:tu});}}):null));
    }))):h("p",{text:"Aucune touche difficile : bravo !"});
  const phrases=h("details",{},h("summary",{text:"Détail des phrases"}),h("table",{},h("thead",{},h("tr",{},["N°","Niveau","Étoiles","Erreurs","Effacements","Temps"].map(function(t){return h("th",{text:t});}))),
    h("tbody",{},d.res.map(function(r,i){return h("tr",{},[i+1,r.niv||"",r.done?"★".repeat(r.stars)+"☆".repeat(3-r.stars):"non fini",r.errors,r.dels,sec1(r.ms)].map(function(c){return h("td",{text:String(c)});}));}))));

      h("div",{class:"score pop","aria-label":"Score : "+b.score+" sur 100"},String(b.score),h("small",{text:" / 100"})),
      h("p",{style:"font-size:1.6rem;font-weight:800",text:b.rang.e+" "+b.rang.t}),
      d.record?h("p",{class:"pill",text:d.premier?"Premier score enregistré !":"Nouveau record !"}):null),
    h("div",{class:"card"},h("h2",{text:"Ton bilan"}),h("div",{class:"stats"},tuiles.map(function(t){return h("div",{class:"stat"},h("span",{"aria-hidden":"true",text:t[0]}),h("b",{text:String(t[1])}),h("span",{text:t[2]}));})),
      h("p",{class:"note"},b.parts.map(function(p){return p.k+" : "+p.v+" / "+p.max;}).join(" · ")+(d.chrono?"":" · Le temps ne compte pas dans le score (sans chrono).")),
      ),

    h("div",{class:"card"},phrases),

function copier(txt){
  const secours=function(){
    const ta=h("textarea",{readonly:true,rows:"6",style:"width:100%",text:txt});
    dialogue({titre:"Copie ton résultat",texte:["Sélectionne le texte puis copie-le (Ctrl + C)."],contenu:ta,boutons:[{l:"Fermer"}]});
    setTimeout(function(){ta.select();},50);
  };
  try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){toast("Résultat copié !");},secours); else secours(); }
  catch(e){secours();}
}

/* ===== G. INSTALLATION, PLEIN ÉCRAN, MISE À JOUR ===== */
let promptInstall=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();promptInstall=e;});
window.addEventListener("appinstalled",function(){promptInstall=null;Stock.set("install","installed");fermerDialogue();toast("Appli installée !");});
function estInstallee(){
  try{return matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||navigator.standalone===true;}catch(e){return false;}
}
function estIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);}
function schemaIOS(){ // schéma SVG : Partager → Sur l’écran d’accueil → Ajouter
  const NS="http://www.w3.org/2000/svg", svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 300 90");svg.setAttribute("role","img");svg.setAttribute("aria-label","Partager, puis Sur l’écran d’accueil, puis Ajouter");svg.style.width="100%";
  const el=function(t,a){const e=document.createElementNS(NS,t);Object.keys(a).forEach(function(k){e.setAttribute(k,a[k]);});svg.appendChild(e);return e;};
  [[10,"Partager"],[110,"Sur l’écran d’accueil"],[210,"Ajouter"]].forEach(function(x,i){
    el("rect",{x:x[0],y:8,width:80,height:50,rx:12,fill:"#EDF1F9",stroke:"#1D2240","stroke-width":2});
    const t=el("text",{x:x[0]+40,y:80,"text-anchor":"middle","font-size":10,fill:"#1D2240"});t.textContent=x[1];
    if(i===0){el("rect",{x:x[0]+28,y:28,width:24,height:22,rx:3,fill:"none",stroke:"#1D2240","stroke-width":2});el("path",{d:"M"+(x[0]+40)+" 34 V12 M"+(x[0]+32)+" 20 L"+(x[0]+40)+" 12 L"+(x[0]+48)+" 20",fill:"none",stroke:"#1D2240","stroke-width":2});}
    if(i===1){el("rect",{x:x[0]+26,y:20,width:28,height:28,rx:6,fill:"none",stroke:"#1D2240","stroke-width":2});el("path",{d:"M"+(x[0]+40)+" 27 V41 M"+(x[0]+33)+" 34 H"+(x[0]+47),fill:"none",stroke:"#1D2240","stroke-width":2});}
    if(i===2){const t2=el("text",{x:x[0]+40,y:40,"text-anchor":"middle","font-size":16,"font-weight":"bold",fill:"#2F7F86"});t2.textContent="Ajouter";}
  });
  el("path",{d:"M92 33 H108 M200 33 H208",stroke:"#1D2240","stroke-width":2});
  return svg;
}
function ouvrirInstall(manuel){
  const plusTard=function(){Stock.set("install_later",String(Date.now()+5*86400000));};
  const note="Rien n’est envoyé à un tiers : l’appli reste sur ton appareil et marche sans Internet.";
  if(estInstallee()){dialogue({titre:"Appli déjà installée",texte:["Tu utilises déjà l’appli installée."],boutons:[{l:"Fermer"}]});return;}
  if(promptInstall){
    dialogue({titre:"Installer l’appli ?",texte:["Ajoute « Clavier en jeu » à ton écran d’accueil pour jouer plus vite, même sans Internet.",note],esc:plusTard,boutons:[
      {l:"Installer l’appli",fn:function(){try{promptInstall.prompt();promptInstall.userChoice.then(function(c){if(c.outcome!=="accepted")plusTard();promptInstall=null;});}catch(e){toast("Installation impossible ici.");}}},
      {l:"Plus tard",ghost:true,fn:plusTard},{l:"Ne plus proposer",ghost:true,fn:function(){Stock.set("install","never");}}]});
  } else if(estIOS()){
    dialogue({titre:"Installer sur iPhone / iPad",texte:["Dans Safari : appuie sur Partager, puis « Sur l’écran d’accueil », puis « Ajouter ».",note],contenu:schemaIOS(),esc:plusTard,boutons:[
      {l:"Compris"},{l:"Plus tard",ghost:true,fn:plusTard},{l:"Ne plus proposer",ghost:true,fn:function(){Stock.set("install","never");}}]});
  } else if(manuel){
    dialogue({titre:"Installer l’appli",texte:["Ouvre le menu de ton navigateur (⋮ ou …), puis cherche « Installer l’appli » ou « Ajouter à l’écran d’accueil ».","Si le choix n’apparaît pas, ce navigateur ne sait pas installer l’appli.",note],boutons:[{l:"Fermer"}]});
  }
}
// Propose l’installation seulement hors partie, après un peu d’usage
function proposerInstall(){
  if(S.propose||S.dlg!==null||!S.touched||Date.now()-S.tLoad<8000||S.ecran==="jeu") return;
  if(estInstallee()) return;
  const st=Stock.get("install"); if(st==="never"||st==="installed") return;
  if(Date.now()<(+Stock.get("install_later")||0)) return;
  if(!(promptInstall||estIOS())) return;
  S.propose=true; ouvrirInstall(false);
}
const pleinEcranDispo=function(){const r=document.documentElement;return !estIOS()&&!!(r.requestFullscreen||r.webkitRequestFullscreen);};
const pleinEcranActif=function(){return !!(document.fullscreenElement||document.webkitFullscreenElement);};
function basculerPlein(){
  try{
    if(pleinEcranActif()) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else {const r=document.documentElement;(r.requestFullscreen||r.webkitRequestFullscreen).call(r);}
  }catch(e){toast("Plein écran impossible ici.");}
}

function surveillerMiseAJour(reg){
  if(!reg) return;
  const montrerBandeau=function(){
    const z=$("#maj-zone"); if(z.firstChild) return;
    z.appendChild(h("div",{class:"update",role:"status"},h("span",{text:"Nouvelle version disponible."}),
      h("button",{class:"btn",type:"button",text:"Recharger",onclick:function(){if(reg.waiting)reg.waiting.postMessage("SKIP_WAITING");else location.reload();}})));
  };
  if(reg.waiting&&navigator.serviceWorker.controller) montrerBandeau();
  reg.addEventListener("updatefound",function(){const w=reg.installing;if(!w)return;
    w.addEventListener("statechange",function(){if(w.state==="installed"&&navigator.serviceWorker.controller)montrerBandeau();});});
  let rech=false; navigator.serviceWorker.addEventListener("controllerchange",function(){if(rech)return;rech=true;location.reload();});
}
